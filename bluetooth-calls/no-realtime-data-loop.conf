## Run WirePlumber's data loop at normal (non-real-time) priority.
## WirePlumber hosts the Bluetooth hands-free (SCO) nodes. With RTKit installed
## that thread got SCHED_RR while WirePlumber's RLIMIT_RTTIME was clamped to 0
## (module-rt misreads RTKit's limit), so the kernel SIGKILLed WirePlumber the
## moment a phone call's audio started. PipeWire's own threads stay real-time.

context.properties = {
  context.data-loops = [
    {
      loop.rt-prio = 0
      loop.class = [ data.rt audio.rt ]
      thread.name = data-loop.0
    }
  ]
}
