## Bluetooth hands-free (HFP) calls on the MacBookPro13,3's UART Broadcom adapter (hci_uart_bcm, BCM2E7C).
## Wideband mSBC sounded robotic and choppy here; plain CVSD (8 kHz) is clear.
## Install to ~/.config/wireplumber/wireplumber.conf.d/ and restart WirePlumber.
monitor.bluez.properties = {
  bluez5.enable-msbc = false
}
